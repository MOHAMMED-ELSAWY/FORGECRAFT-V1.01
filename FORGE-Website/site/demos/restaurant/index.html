<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Digital Platform — FORGE demo</title>
<meta name="description" content="A FORGE demo project: a restaurant digital menu with online ordering and a staff order dashboard. All data is fictional.">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ch:#111827;--sl:#6B7280;--lt:#F3F4F6;--bd:#E5E7EB;--or:#F97316;--fh:"Montserrat",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--fa:"Cairo",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ch);font:16px/1.6 var(--fb);-webkit-font-smoothing:antialiased;padding-block-end:90px}
html[dir=rtl] body{font-family:var(--fa)}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--fh);letter-spacing:-.02em;line-height:1.2}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:var(--fa);letter-spacing:0}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ch);outline-offset:2px}
[hidden]{display:none!important}
.wrap{width:calc(100% - 32px);max-width:1100px;margin-inline:auto}
.demo-strip{background:var(--ch);color:#fff;font-size:13px}
.demo-strip .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.demo-strip a{border-block-end:2px solid var(--or);font-weight:600}
.topbar{position:sticky;inset-block-start:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-block-end:1px solid var(--bd)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--fh);font-weight:800;font-size:20px}
html[dir=rtl] .brand{font-family:var(--fa)}
.tabs{display:flex;gap:6px;margin-inline-start:auto}
.tab,.lang{min-height:40px;padding:0 14px;border:1px solid var(--bd);border-radius:4px;background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.tab[aria-current=page]{background:var(--ch);color:#fff;border-color:var(--ch)}
.btn{min-height:46px;padding:10px 18px;border:1px solid transparent;border-radius:4px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--or);color:var(--ch)}.btn-p:hover{background:#fb8a3c}
.btn-d{background:var(--ch);color:#fff}.btn-l{border-color:var(--ch);background:#fff}
.btn-s{min-height:38px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero{padding-block:28px 8px}.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{color:var(--sl);margin-block-start:6px}
.controls{position:sticky;inset-block-start:64px;z-index:15;background:#fff;padding-block:12px;border-block-end:1px solid var(--bd)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block-end:4px}
.cat{flex:none;min-height:40px;padding:0 16px;border:1px solid var(--bd);border-radius:999px;background:#fff;font-weight:600;font-size:14px}
.cat[aria-pressed=true]{background:var(--ch);color:#fff;border-color:var(--ch)}
.search{width:100%;min-height:44px;margin-block-start:10px;padding:0 14px;border:1px solid var(--sl);border-radius:4px}
.items{display:grid;gap:0;margin-block-start:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding-block:18px;border-block-end:1px solid var(--bd)}
.item h3{font-size:17px}.item p{color:var(--sl);font-size:14px;grid-column:1}
.price{font-weight:700}.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;grid-row:1/span 2;grid-column:2}
html[dir=rtl] .right{align-items:flex-start}
.soldout{opacity:.55}.tagso{font-size:12px;font-weight:700;border:1px solid var(--ch);padding:2px 8px;border-radius:3px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ch);border-radius:4px}
.qty button{width:38px;height:38px;border:0;background:transparent;font-size:18px;font-weight:700}
.qty span{min-width:28px;text-align:center;font-weight:700}
.empty{padding:40px 0;color:var(--sl);text-align:center}
.cartbar{position:fixed;inset-inline:0;inset-block-end:0;z-index:30;background:#fff;border-block-start:1px solid var(--bd);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.cartbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:0;border-radius:8px;box-shadow:0 30px 90px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(17,24,39,.7)}
.dlg{padding:22px}.dlg h2{font-size:22px;margin-block-end:14px}
.x{position:absolute;inset-block-start:12px;inset-inline-end:12px;width:40px;height:40px;border:1px solid var(--bd);border-radius:50%;background:#fff;font-size:20px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:10px;border-block-end:1px solid var(--bd)}
.line small{color:var(--sl);display:block}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-block:14px}
.field{display:grid;gap:6px;margin-block-start:14px}.field label{font-size:13px;font-weight:700}
.field input,.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--sl);border-radius:4px}
.field textarea{min-height:70px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--bd);border-radius:4px;background:#fff;font-weight:600;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ch);color:#fff;border-color:var(--ch)}
.err{color:var(--ch);font-size:12px;font-weight:600;border-inline-start:3px solid var(--or);padding-inline-start:8px}
.done{text-align:center;padding-block:10px}.done .n{font-family:var(--fh);font-size:34px;font-weight:800}
/* staff */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:20px}
.stat{padding:14px;border:1px solid var(--bd);border-radius:6px}.stat b{display:block;font-size:clamp(1.2rem,3vw,1.8rem);font-family:var(--fh)}.stat span{font-size:13px;color:var(--sl)}
.board{display:grid;gap:14px}
.col{background:var(--lt);border-radius:6px;padding:12px;min-height:120px}
.col h3{font-size:14px;display:flex;justify-content:space-between;margin-block-end:10px}
.ord{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:12px;margin-block-end:10px;font-size:14px}
.ord header{display:flex;justify-content:space-between;font-weight:700;margin-block-end:6px}
.ord ul{color:var(--sl);margin-block-end:8px}.ord .meta{font-size:12px;color:var(--sl);margin-block-end:8px}
.ord .acts{display:flex;gap:6px;flex-wrap:wrap}
.menu-admin{margin-block-start:26px}.menu-admin h2{font-size:20px;margin-block-end:8px}
.tog{display:flex;justify-content:space-between;align-items:center;padding-block:10px;border-block-end:1px solid var(--bd);gap:10px}
.sw{min-width:92px}
@media(min-width:760px){.items{grid-template-columns:1fr 1fr;column-gap:40px}.board{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="demo-strip"><div class="wrap"><span id="demoNote"></span><a id="backLink" href="../../work/"></a></div></div>
<header class="topbar"><div class="wrap">
<span class="brand" id="brand"></span>
<nav class="tabs" aria-label="Views"><a class="tab" id="tabMenu" href="#/"></a><a class="tab" id="tabStaff" href="#/staff"></a><button class="lang" id="langBtn" type="button"></button></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="cartbar" id="cartbar" hidden><div class="wrap"><div><b id="cbCount"></b> · <span id="cbTotal"></span></div><button class="btn btn-p" id="cbOpen" type="button"></button></div></div>
<dialog id="dlg"><button class="x" id="dlgX" type="button" aria-label="Close">×</button><div class="dlg" id="dlgBody"></div></dialog>
<script>

{id:2,c:"starters",en:"Baba ghanoush",ar:"بابا غنوج",de:"Smoked eggplant, tahini, olive oil.",da:"باذنجان مشوي وطحينة وزيت زيتون.",p:60},

{id:5,c:"mains",en:"Molokhia with chicken",ar:"ملوخية بالفراخ",de:"Garlic molokhia, rice and roasted chicken.",da:"ملوخية بالثوم مع أرز وفراخ محمرة.",p:130},
{id:6,c:"mains",en:"Chicken shawarma",ar:"شاورما فراخ",de:"Wrapped with garlic sauce and pickles.",da:"ساندوتش بصلصة الثوم والمخلل.",p:95},

var CATS=["starters","mains","drinks","desserts"];
var T={

 starters:"مقبلات",mains:"أطباق رئيسية",drinks:"مشروبات",desserts:"حلويات",all:"الكل",title:"قائمة اليوم",sub:"اختر أطباقك ثم أرسل الطلب.",search:"ابحث في القائمة",
 add:"أضف",sold:"نفد",none:"لا توجد أطباق مطابقة للبحث.",items:"أصناف",view:"عرض الطلب",your:"طلبك",empty:"طلبك فارغ. أضف طبقًا من القائمة.",
 note:"ملاحظات للمطبخ",type:"كيف تريد الطلب؟",delivery:"توصيل",pickup:"استلام",table:"على الطاولة",name:"الاسم",phone:"رقم الهاتف",address:"عنوان التوصيل",tableNo:"رقم الطاولة",

var K={orders:"forge-rest-orders",sold:"forge-rest-sold",seq:"forge-rest-seq",lang:"forge-demo-lang"};
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var lang=ls(K.lang,null)||((document.referrer.indexOf("/ar/")>-1||(navigator.language||"").indexOf("ar")===0)?"ar":"en");
var st={cat:"all",q:"",cart:{},type:"delivery",form:{name:"",phone:"",addr:"",table:"",note:""},err:{}};
var $=function(s){return document.querySelector(s)};
function t(k){return T[lang][k]||k}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return new Intl.NumberFormat(lang==="ar"?"ar-EG":"en-US").format(n)+" "+t("egp")}
function nm(i){return lang==="ar"?i.ar:i.en}
function ds(i){return lang==="ar"?i.da:i.de}
function sold(){return ls(K.sold,[])}
function orders(){return ls(K.orders,[])}
function seed(){
 if(orders().length)return;
 var now=Date.now(),mk=function(id,items,type,name,min,status,extra){var tot=0,l=items.map(function(x){var m=MENU.filter(function(y){return y.id===x[0]})[0];tot+=m.p*x[1];return{id:m.id,q:x[1]}});
  return Object.assign({id:id,items:l,total:tot,type:type,name:name,phone:"01000000000",note:"",status:status,at:now-min*60000},extra||{})};

}
/* ---------- views ---------- */
function route(){return location.hash==="#/staff"?"staff":"menu"}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("#demoNote").textContent=t("demo");$("#backLink").textContent=t("back");$("#backLink").href=lang==="ar"?"../../ar/work/":"../../work/";
 $("#brand").textContent=t("brand");$("#tabMenu").textContent=t("menu");$("#tabStaff").textContent=t("staff");
 $("#langBtn").textContent=lang==="ar"?"English":"العربية";
 var r=route();$("#tabMenu").toggleAttribute("aria-current",r==="menu");$("#tabStaff").toggleAttribute("aria-current",r==="staff");
 if($("#tabMenu").hasAttribute("aria-current"))$("#tabMenu").setAttribute("aria-current","page");
 document.title=t("brand")+" — FORGE demo";
 if(r==="menu")renderMenu();else renderStaff();
 renderCartBar();
}
function renderMenu(){
 var so=sold(),q=st.q.trim().toLowerCase();
 var list=MENU.filter(function(i){return(st.cat==="all"||i.c===st.cat)&&(!q||(i.en+i.ar+i.de+i.da).toLowerCase().indexOf(q)>-1)});
 var cats=["all"].concat(CATS).map(function(c){return'<button class="cat" type="button" data-cat="'+c+'" aria-pressed="'+(st.cat===c)+'">'+esc(t(c))+'</button>'}).join("");
 var items=list.map(function(i){var s=so.indexOf(i.id)>-1,q=st.cart[i.id]||0;
  var ctl=s?'<span class="tagso">'+esc(t("sold"))+'</span>':(q?'<div class="qty"><button type="button" data-dec="'+i.id+'" aria-label="−">−</button><span>'+q+'</span><button type="button" data-inc="'+i.id+'" aria-label="+">+</button></div>':'<button class="btn btn-d btn-s" type="button" data-inc="'+i.id+'">'+esc(t("add"))+'</button>');
  return'<li class="item'+(s?' soldout':'')+'"><h3>'+esc(nm(i))+'</h3><p>'+esc(ds(i))+'</p><div class="right"><span class="price">'+money(i.p)+'</span>'+ctl+'</div></li>'}).join("");
 $("#app").innerHTML='<section class="hero"><h1>'+esc(t("title"))+'</h1><p>'+esc(t("sub"))+'</p></section>'+
 '<div class="controls"><div class="cats" role="group">'+cats+'</div><input class="search" id="search" type="search" placeholder="'+esc(t("search"))+'" aria-label="'+esc(t("search"))+'" value="'+esc(st.q)+'"></div>'+
 (items?'<ul class="items">'+items+'</ul>':'<p class="empty">'+esc(t("none"))+'</p>');
}
function cartLines(){return Object.keys(st.cart).map(function(id){var m=MENU.filter(function(x){return x.id==+id})[0];return{m:m,q:st.cart[id]}}).filter(function(l){return l.m&&l.q>0})}
function cartTotal(){return cartLines().reduce(function(s,l){return s+l.m.p*l.q},0)}
function cartCount(){return cartLines().reduce(function(s,l){return s+l.q},0)}
function renderCartBar(){
 var n=cartCount(),show=route()==="menu"&&n>0;$("#cartbar").hidden=!show;
 if(show){$("#cbCount").textContent=n+" "+t("items");$("#cbTotal").textContent=money(cartTotal());$("#cbOpen").textContent=t("view")}
}
function openDlg(html){$("#dlgBody").innerHTML=html;var d=$("#dlg");if(!d.open)d.showModal()}
function closeDlg(){var d=$("#dlg");if(d.open)d.close()}
function cartDialog(){
 var L=cartLines();
 if(!L.length){openDlg('<h2>'+esc(t("your"))+'</h2><p class="empty">'+esc(t("empty"))+'</p>');return}
 var e=st.err,f=st.form;
 var lines=L.map(function(l){return'<div class="line"><div>'+esc(nm(l.m))+'<small>'+l.q+' × '+money(l.m.p)+'</small></div><b>'+money(l.m.p*l.q)+'</b></div>'}).join("");
 var seg=["delivery","pickup","table"].map(function(k){return'<button type="button" data-type="'+k+'" aria-pressed="'+(st.type===k)+'">'+esc(t(k))+'</button>'}).join("");
 var extra=st.type==="delivery"?fld("addr",t("address"),f.addr,e.addr):st.type==="table"?fld("table",t("tableNo"),f.table,e.table):"";
 openDlg('<h2>'+esc(t("your"))+'</h2>'+lines+'<div class="total"><span>'+esc(t("subtotal"))+'</span><span>'+money(cartTotal())+'</span></div>'+
  '<div class="field"><label>'+esc(t("type"))+'</label><div class="seg">'+seg+'</div></div>'+fld("name",t("name"),f.name,e.name)+fld("phone",t("phone"),f.phone,e.phone,"tel")+extra+
  '<div class="field"><label for="f-note">'+esc(t("note"))+'</label><textarea id="f-note" data-f="note">'+esc(f.note)+'</textarea></div>'+
  '<button class="btn btn-p" style="width:100%;margin-block-start:18px" type="button" id="place">'+esc(t("place"))+'</button>');
}
function fld(k,label,val,err,type){return'<div class="field"><label for="f-'+k+'">'+esc(label)+'</label><input id="f-'+k+'" data-f="'+k+'" type="'+(type||"text")+'" value="'+esc(val)+'" '+(err?'aria-invalid="true" ':'')+'>'+(err?'<span class="err">'+esc(err)+'</span>':'')+'</div>'}
function place(){
 var f=st.form,e={};
 if(f.name.trim().length<2)e.name=t("fName");
 if(!/^[+0-9()\s.-]{7,20}$/.test(f.phone.trim()))e.phone=t("fPhone");
 if(st.type==="delivery"&&f.addr.trim().length<4)e.addr=t("fAddr");
 if(st.type==="table"&&!f.table.trim())e.table=t("fTable");
 st.err=e;if(Object.keys(e).length){cartDialog();var first=document.querySelector('#dlg [aria-invalid="true"]');if(first)first.focus();return}
 var id=ls(K.seq,1040)+1;sv(K.seq,id);
 var o={id:id,items:cartLines().map(function(l){return{id:l.m.id,q:l.q}}),total:cartTotal(),type:st.type,name:f.name.trim(),phone:f.phone.trim(),addr:f.addr.trim(),table:f.table.trim(),note:f.note.trim(),status:"new",at:Date.now()};
 var all=orders();all.push(o);sv(K.orders,all);st.cart={};st.err={};
 openDlg('<div class="done"><h2>'+esc(t("thanks"))+'</h2><p>'+esc(t("num"))+'</p><p class="n">#'+id+'</p><p style="color:#6B7280;margin-block:10px 18px">'+esc(t("thanksTxt"))+'</p><div style="display:grid;gap:8px"><a class="btn btn-p" href="#/staff" id="goStaff">'+esc(t("openStaff"))+'</a><button class="btn btn-l" type="button" id="closeDlg">'+esc(t("orderMore"))+'</button></div></div>');
 render();
}
var NEXT={"new":"prep",prep:"ready",ready:"done"};
function renderStaff(){
 var all=orders().slice().sort(function(a,b){return a.at-b.at}),today=new Date().toDateString();
 var td=all.filter(function(o){return new Date(o.at).toDateString()===today&&o.status!=="cancelled"});
 var rev=td.reduce(function(s,o){return s+o.total},0);
 var cols=[["new","sNew","toPrep"],["prep","sPrep","toReady"],["ready","sReady","toDone"],["done","sDone",""]].map(function(c){
  var os=all.filter(function(o){return o.status===c[0]});if(c[0]==="done")os=os.slice(-6);
  var cards=os.map(function(o){var lines=o.items.map(function(x){var m=MENU.filter(function(y){return y.id===x.id})[0];return"<li>"+x.q+" × "+esc(nm(m))+"</li>"}).join("");
   var where=o.type==="delivery"?t("tDelivery")+(o.addr?" · "+esc(o.addr):""):o.type==="table"?t("tTable")+" "+esc(o.table||""):t("tPickup");
   var tm=new Date(o.at).toLocaleTimeString(lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit"});
   var acts=(NEXT[o.status]?'<button class="btn btn-d btn-s" type="button" data-adv="'+o.id+'">'+esc(t(c[2]))+'</button>':"")+(o.status==="new"?'<button class="btn btn-l btn-s" type="button" data-cancel="'+o.id+'">'+esc(t("cancel"))+'</button>':"");
   return'<div class="ord"><header><span>#'+o.id+' · '+esc(o.name)+'</span><span>'+money(o.total)+'</span></header><div class="meta">'+tm+' · '+where+'</div><ul>'+lines+'</ul>'+(o.note?'<div class="meta">“'+esc(o.note)+'”</div>':"")+'<div class="acts">'+acts+'</div></div>'}).join("");
  return'<section class="col" aria-label="'+esc(t(c[1]))+'"><h3><span>'+esc(t(c[1]))+'</span><span>'+os.length+'</span></h3>'+(cards||'<p style="color:#6B7280;font-size:13px">'+esc(t("noOrders"))+'</p>')+'</section>'}).join("");
 var so=sold();
 var tg=MENU.map(function(i){var s=so.indexOf(i.id)>-1;return'<div class="tog"><span>'+esc(nm(i))+'</span><button class="btn btn-s sw '+(s?'btn-d':'btn-l')+'" type="button" data-tog="'+i.id+'" aria-pressed="'+s+'">'+esc(s?t("soldBtn"):t("avail"))+'</button></div>'}).join("");
 $("#app").innerHTML='<section class="hero"><h1>'+esc(t("staff"))+'</h1></section><div class="stats"><div class="stat"><b>'+td.length+'</b><span>'+esc(t("stOrders"))+'</span></div><div class="stat"><b>'+money(rev)+'</b><span>'+esc(t("stRev"))+'</span></div><div class="stat"><b>'+money(td.length?Math.round(rev/td.length):0)+'</b><span>'+esc(t("stAvg"))+'</span></div></div>'+
  '<div class="board">'+cols+'</div><section class="menu-admin"><h2>'+esc(t("availability"))+'</h2>'+tg+'<p style="margin-block-start:18px"><button class="btn btn-l btn-s" type="button" id="reset">'+esc(t("reset"))+'</button></p></section>';
}
/* ---------- events ---------- */
document.addEventListener("click",function(ev){
 var b=ev.target.closest("button,a");if(!b)return;
 if(b.dataset.cat){st.cat=b.dataset.cat;renderMenu();return}
 if(b.dataset.inc){var id=b.dataset.inc;st.cart[id]=(st.cart[id]||0)+1;render();var again=document.querySelector('[data-inc="'+id+'"],[data-dec="'+id+'"]');if(again)again.focus({preventScroll:true});return}
 if(b.dataset.dec){var id2=b.dataset.dec;st.cart[id2]=Math.max(0,(st.cart[id2]||0)-1);render();var a2=document.querySelector('[data-inc="'+id2+'"],[data-dec="'+id2+'"]');if(a2)a2.focus({preventScroll:true});return}
 if(b.id==="cbOpen"){st.err={};cartDialog();return}
 if(b.dataset.type){st.type=b.dataset.type;st.err={};cartDialog();return}
 if(b.id==="place"){place();return}
 if(b.id==="closeDlg"||b.id==="dlgX"){closeDlg();return}
 if(b.id==="goStaff"){closeDlg();return}
 if(b.id==="langBtn"){lang=lang==="ar"?"en":"ar";sv(K.lang,lang);render();return}
 if(b.dataset.adv){var all=orders();all.forEach(function(o){if(o.id==+b.dataset.adv&&NEXT[o.status])o.status=NEXT[o.status]});sv(K.orders,all);renderStaff();return}
 if(b.dataset.cancel){var al=orders();al.forEach(function(o){if(o.id==+b.dataset.cancel)o.status="cancelled"});sv(K.orders,al);renderStaff();return}
 if(b.dataset.tog){var s=sold(),i=+b.dataset.tog,ix=s.indexOf(i);if(ix>-1)s.splice(ix,1);else s.push(i);sv(K.sold,s);renderStaff();return}
 if(b.id==="reset"){try{localStorage.removeItem(K.orders);localStorage.removeItem(K.sold);localStorage.removeItem(K.seq)}catch(e){}seed();render();return}
});
document.addEventListener("input",function(ev){
 var el=ev.target;
 if(el.id==="search"){st.q=el.value;var pos=el.selectionStart;renderMenu();var n=$("#search");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}return}
 if(el.dataset&&el.dataset.f){st.form[el.dataset.f]=el.value;if(st.err[el.dataset.f]){delete st.err[el.dataset.f];el.removeAttribute("aria-invalid")}}
});
$("#dlg").addEventListener("click",function(e){if(e.target===this)closeDlg()});
window.addEventListener("hashchange",function(){closeDlg();render();window.scrollTo(0,0)});
window.addEventListener("storage",function(){render()});
seed();render();
})();
</script>
</body>
</html>
